  <script>
    window.ashwakeStartError = function (message) {
      var start = document.getElementById("start");
      if (!start || start.dataset.ready === "true") return;
      var status = document.getElementById("startStatus");
      start.disabled = false;
      start.setAttribute("aria-busy", "false");
      document.getElementById("startLabel").textContent = "重新加载";
      status.textContent = message;
      status.hidden = false;
      start.onclick = function () { location.reload(); };
    };
    window.addEventListener("error", function (event) {
      if (event.target === window || event.target.tagName === "SCRIPT") {
        window.ashwakeStartError("游戏程序未能启动。点击重新加载再试一次。");
      }
    }, true);
    setTimeout(function () {
      window.ashwakeStartError("游戏程序还未下载完成。可以继续等待，或点击重新加载。");
    }, 4500);
  </script>

"use strict";

const TILE=52, MAZE_COLS=59, MAZE_ROWS=48;
const WORLD_W=MAZE_COLS*TILE, WORLD_H=MAZE_ROWS*TILE;
const BOSS_ROOM_SEAL=3;
const tileIndex=(x,y)=>y*MAZE_COLS+x;

const tileDirections=[[-1,0],[1,0],[0,-1],[0,1]];

const roomForms={
  landing:{name:"阶梯前庭",crop:[.13,.25,.71,.58]},
  nave:{name:"多层主殿",crop:[.14,.12,.72,.75]},
  cloister:{name:"四柱回廊",crop:[.26,.3,.48,.58]},
  rift:{name:"断层双桥",crop:[.08,.43,.78,.45]},
  chapel:{name:"偏殿龛室",crop:[.38,.18,.56,.61]},
  switchback:{name:"错台长廊",crop:[.28,.16,.62,.67]},
  basin:{name:"阶环沉庭",crop:[.14,.31,.73,.5]},
  archives:{name:"折角藏库",crop:[.19,.13,.72,.64]},
  gallery:{name:"双翼长厅",crop:[.13,.22,.74,.55]}

function roomFeature(form,x,y,w,h,flip){
  const u=x*flip;
  const corner=Math.abs(x)>=w-1&&Math.abs(y)>=h-1;
  if(form==="cloister"&&Math.abs(x)===3&&Math.abs(y)===2)return 1;
  if(form==="rift"&&x===3*flip&&(y===0||Math.abs(y)>=3)&&Math.abs(y)<h)return 2;
  if(form==="archives"&&u===-3&&y>=1&&y<=3)return 1;
  if(form==="switchback"&&Math.abs(x)>=3&&Math.abs(x)<=4&&Math.abs(y)===2&&x*y*flip>0)return 1;
  if(form==="chapel"&&u>=3&&y>=2&&y<=3)return 3;
  if(form==="gallery"&&Math.abs(x)>=4&&Math.abs(y)>=h-1)return 3;
  if(form==="nave"&&Math.abs(x)===4&&Math.abs(y)===2)return 1;
  if(form==="landing"&&corner&&y>0)return 3;
  if(form!=="nave"&&form!=="landing"&&corner)return 3;
  if(form==="archives"&&u>=4&&y<=-2)return 3;
  return 0;
}

function mazeLayout(bossFloor=false){
  const cells=new Uint8Array(MAZE_COLS*MAZE_ROWS), doors=[], entrances=[];
  let bossDoor=null;
  const owners=new Int8Array(cells.length).fill(-1);
  const seals=new Uint8Array(cells.length),features=new Uint8Array(cells.length);
  const seen=new Uint8Array(cells.length);
  const wing=Math.random()<.5?0:2;
  const entrySlot=7, gateSlot=Math.random()<.5?wing:1;
  const neighbors=(a,b)=>Math.abs(a%3-b%3)+Math.abs(Math.floor(a/3)-Math.floor(b/3))===1;
  const shuffle=list=>{
    for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]]}
    return list;
  };
  const slots=[entrySlot,gateSlot,...shuffle([4,3+wing,6+wing])];

  const forms=["landing","nave",...shuffle(["cloister","rift","chapel","switchback","basin","archives","gallery"]).slice(0,3)];
  const mazeRooms=slots.map((slot,i)=>{
    const tx=29+(slot%3-1)*17+(wing===0?8:-8),ty=8+Math.floor(slot/3)*14;
    const form=forms[i], flip=Math.random()<.5?-1:1;
    const halfW=form==="gallery"?7:form==="chapel"?5:6;
    const halfH=form==="gallery"?4:form==="chapel"?4:5;
    const node={slot,tx,ty,form,flip,number:i,x:(tx+.5)*TILE,y:(ty+.5)*TILE,
      left:tx-halfW,right:tx+halfW+1,top:ty-halfH,bottom:ty+halfH+1};
    for(let y=node.top;y<node.bottom;y++)for(let x=node.left;x<node.right;x++){
      const k=tileIndex(x,y), feature=roomFeature(form,x-tx,y-ty,halfW,halfH,flip);
      features[k]=feature;
      if(!feature){cells[k]=2;owners[k]=i}
    }
    return node;
  });
  const regular=mazeRooms.filter(n=>n.number!==1);
  const possibilities=[];
  for(const a of regular)for(const b of regular)if(a.number<b.number&&neighbors(a.slot,b.slot))possibilities.push([a,b]);
  const groups=mazeRooms.map(n=>n.number), paths=[], spare=[];
  for(const [a,b] of shuffle(possibilities)){
    if(groups[a.number]===groups[b.number]){spare.push([a,b]);continue}
    const old=groups[b.number],next=groups[a.number];
    groups.forEach((g,i)=>{if(g===old)groups[i]=next});
    paths.push([a,b,0]);
  }
  if(spare.length){
    const [a,b]=spare[0];paths.push([a,b,2]);
  }
  const gate=mazeRooms[1], connection=shuffle(regular.filter(n=>neighbors(n.slot,gateSlot)))[0];
  paths.push([connection,gate,1]);

  function carve(x,y){
    const k=tileIndex(x,y);
    if(!cells[k]){cells[k]=1;features[k]=0}
  }
  for(const [a,b,lock] of paths){
    const sameRow=a.ty===b.ty;
    const first=(sameRow?a.tx<b.tx:a.ty<b.ty)?a:b, last=first===a?b:a;
    const start=sameRow?first.tx:first.ty, end=sameRow?last.tx:last.ty;
    const cross=sameRow?a.ty:a.tx;
    const offsetA=Math.floor(Math.random()*5)-2,offsetB=Math.floor(Math.random()*5)-2;
    const bend=Math.floor((start+end)/2);
    const edgeA=sameRow?first.right:first.bottom, edgeB=sameRow?last.left:last.top;
    for(const [edge,offset,sign] of [[edgeA,offsetA,1],[edgeB,offsetB,-1]]){
      const center=(cross+offset+.5)*TILE;
      entrances.push({x:sameRow?edge*TILE:center,y:sameRow?center:edge*TILE,a:sameRow?0:Math.PI/2,sign});
    }
    if(lock){
      const center=cross+(offsetA+offsetB)/2;
      doors.push({type:lock,x:((sameRow?bend:center)+.5)*TILE,y:((sameRow?center:bend)+.5)*TILE});
    }
    let bossDoorTile=-1;
    if(bossFloor&&lock===1){
      const inward=last===gate?1:-1;
      const edge=inward===1?edgeB:edgeA;
      const center=cross+(inward===1?offsetB:offsetA);
      bossDoorTile=inward===1?edge-1:edge;
      bossDoor={type:BOSS_ROOM_SEAL,axis:sameRow?"x":"y",boundary:edge*TILE,inward,locked:false,
        x:((sameRow?bossDoorTile:center)+.5)*TILE,y:((sameRow?center:bossDoorTile)+.5)*TILE};
      doors.push(bossDoor);
    }
    for(let along=start;along<=end;along++){
      const from=cross+(along===bend?Math.min(offsetA,offsetB):along<bend?offsetA:offsetB);
      const to=cross+(along===bend?Math.max(offsetA,offsetB):along<bend?offsetA:offsetB);
      const fromRoom=along<bend?along-edgeA:edgeB-1-along;
      const lower=along!==bend&&(fromRoom===0||fromRoom===1)?2:1;
      const upper=along!==bend&&fromRoom===0?2:1;
      for(let normal=from-lower;normal<=to+upper;normal++){
        const x=sameRow?along:normal,y=sameRow?normal:along;
        if(along>=edgeA-1&&along<=edgeB)carve(x,y);
        if(lock&&along===bend)seals[tileIndex(x,y)]=lock;
        if(along===bossDoorTile)seals[tileIndex(x,y)]=BOSS_ROOM_SEAL;
      }
    }
    if(!lock&&Math.abs(offsetA-offsetB)<=2){
      const side=Math.random()<.5?-1:1, turnOffset=cross+offsetA+side*2;
      for(let i=-1;i<=1;i++)for(let j=0;j<=1;j++){
        if(edgeA<=bend+i&&bend+i<edgeB){const n=turnOffset+side*j;carve(sameRow?bend+i:n,sameRow?n:bend+i)}
      }
    }
  }
  return {cells,owners,seals,features,seen,doors,bossDoor,entrances,nodes:mazeRooms,cleared:0,safe:false,hostile:false,rewarded:false,viewTile:-1,field:null};
}

function sealOpen(map,lock){
  if(lock===1)return map.cleared>=map.nodes.length-1;
  if(lock===2)return map.safe;
  return lock!==BOSS_ROOM_SEAL||!map.bossDoor.locked;
}
function openTile(map,tx,ty){
  if(tx<0||tx>=MAZE_COLS||ty<0||ty>=MAZE_ROWS)return false;
  const k=tileIndex(tx,ty);
  return map.cells[k]!==0&&sealOpen(map,map.seals[k]);
}
function standOn(map,x,y,r=0){
  const left=Math.floor((x-r)/TILE),right=Math.floor((x+r)/TILE),top=Math.floor((y-r)/TILE),bottom=Math.floor((y+r)/TILE);
  for(let row=top;row<=bottom;row++)for(let col=left;col<=right;col++)if(!openTile(map,col,row))return false;
  return true;
}
function walkBody(map,body,dx,dy){
  if(!dx&&!dy)return;
  const steps=Math.max(1,Math.ceil(Math.max(Math.abs(dx),Math.abs(dy))/(TILE*.33)));
  const x=dx/steps,y=dy/steps,r=body.r??0;
  for(let i=0;i<steps;i++){
    if(x&&standOn(map,body.x+x,body.y,r))body.x+=x;
    if(y&&standOn(map,body.x,body.y+y,r))body.y+=y;
  }
}
function floorSight(map,a,b){
  const dx=b.x-a.x,dy=b.y-a.y,steps=Math.max(1,Math.ceil(Math.hypot(dx,dy)/(TILE/4)));
  let previousX, previousY;
  for(let i=1;i<=steps;i++){
    const x=Math.floor((a.x+dx*i/steps)/TILE),y=Math.floor((a.y+dy*i/steps)/TILE);
    if(x===previousX&&y===previousY)continue;
    if(!openTile(map,x,y))return false;
    previousX=x;previousY=y;
  }
  return true;
}
function mapDistances(map,origin){
  const result=new Int16Array(map.cells.length).fill(-1);
  const queue=new Int16Array(result.length);
  let size=1;
  queue[0]=origin;result[origin]=0;
  for(let i=0;i<size;i++){
    const k=queue[i],x=k%MAZE_COLS,y=Math.floor(k/MAZE_COLS);
    for(const [dx,dy] of tileDirections){
      const nx=x+dx,ny=y+dy;
      const n=tileIndex(nx,ny);
      if(result[n]>=0||!openTile(map,nx,ny))continue;
      result[n]=result[k]+1;queue[size++]=n;
    }
  }
  return result;
}

const formTints={landing:"#e6ae6c",nave:"#d2ab77",cloister:"#aa95c2",rift:"#81c2df",chapel:"#ce89a5",switchback:"#d49b77",basin:"#8bbeb3",archives:"#b1a37b",gallery:"#a5acd4"};
const floorMaterial=["#351c19","#142b38","#1d3429","#4a2117","#253a47","#291f46","#3e1d29"];
function paintRoomFeatures(pen,map,level,color,nodes=map.nodes){

    pen.fillStyle="#100b16a2";pen.fillRect(x,y+3,w,h+3);

    }
  }
}

    const point=insideTile(col,row), distance=Math.hypot(point.x-x,point.y-y);

"use strict";

const MERCHANT_CHANCE=.30, MERCHANT_PRICE=50;
const merchantColor="#f5c57e";

function rollMerchant(map,random=Math.random){
  if(random()>=MERCHANT_CHANCE)return null;
  const node=map.nodes.find(room=>room.kind==="coil");
  return {node,x:node.x+2*TILE,y:node.y-2*TILE,weapon:weaponIds[Math.floor(random()*weaponIds.length)],sold:false};
}

function merchantInteraction(){
  const shop=floor.merchant;
  if(!shop||!shop.node.done||shop.sold||dist(player,shop)>64||!floorSight(floor,player,shop))return null;
  return {type:"merchant",label:"与收钟人交易",detail:`任购一件 · ${MERCHANT_PRICE} 余烬 · 持有 ${Math.floor(player.ash)}`};
}

function merchantBalance(){
  const missing=MERCHANT_PRICE-Math.floor(player.ash);
  const stock=missing>0?`还差 ${missing} 点余烬，可先看看货物。`:"任选一件，成交后收摊。";
  return `每件 ${MERCHANT_PRICE} 余烬 · 现有 ${Math.floor(player.ash)}。 ${stock}`;
}

function activeMerchant(shop){
  return state==="merchant"&&floor.merchant===shop&&shop.node.done&&!shop.sold;
}
function payMerchant(shop){
  if(!activeMerchant(shop)||player.ash<MERCHANT_PRICE)return false;
  player.ash-=MERCHANT_PRICE;
  shop.sold=true;
  return true;
}

function showMerchant(){
  const shop=floor.merchant;
  if(!shop||shop.sold||!shop.node.done)return;
  state="merchant";resetInput();
  const ownsWeapon=player.weapons.includes(shop.weapon);
  const weaponDisabled=ownsWeapon||player.ash<MERCHANT_PRICE;
  const relicDisabled=!relics.some(canTakeRelic);
  let relicNote=touchUI?"按流派浏览。每件遗物都标有叠加上限。":RELIC_STACK_NOTE;
  if(relicDisabled)relicNote="所有遗物都已达上限。";
  const relicOffer=`<button class="card merchant-relic" data-pick="0"${relicDisabled?" disabled":""}><span class="icon" aria-hidden="true">◈</span><kbd>1</kbd><b>挑选遗物</b><small>${relicNote}</small></button>`;
  const weaponOffer=weaponCard(shop.weapon,1,weaponDisabled);
  const note=merchantBalance()+(ownsWeapon?" 这层售卖的武器已在你的行囊里。":"");
  showModal(heading("收钟人",note)+`<div class="choices two armory merchant-options">${relicOffer}${weaponOffer}</div>`+
    row(btn("merchantLeave","稍后再来")),[relicDisabled?null:()=>showMerchantRelics(shop),weaponDisabled?null:()=>chooseMerchantWeapon(shop)]);
  $("merchantLeave").onclick=leaveMerchant;
}

function showMerchantRelics(shop,school){
  if(!activeMerchant(shop))return;
  const available=relics.filter(canTakeRelic);
  const groups=Object.keys(schools).filter(key=>available.some(r=>r.school===key));
  const active=groups.includes(school)?school:groups[0];
  const items=available.filter(r=>r.school===active), disabled=player.ash<MERCHANT_PRICE;
  const tabs=groups.map(key=>`<button type="button" class="quiet" id="merchant-school-${key}" aria-pressed="${key===active}">${schools[key].name}</button>`).join("");
  showModal(heading("收钟人 · 遗物",merchantBalance())+`<div class="merchant-schools" role="group" aria-label="遗物流派">${tabs}</div>`+
    cards(items,"rewards merchant-relics",disabled)+row(btn("merchantBack","返回货摊"),btn("merchantLeave","离开")),
    items.map(r=>disabled?null:()=>buyMerchantRelic(shop,r)));
  for(const key of groups)$("merchant-school-"+key).onclick=()=>showMerchantRelics(shop,key);
  if(active)$("merchant-school-"+active).focus({preventScroll:true});
  $("merchantBack").onclick=showMerchant;
  $("merchantLeave").onclick=leaveMerchant;
}

function buyMerchantRelic(shop,relic){
  if(!canTakeRelic(relic)||!payMerchant(shop))return;
  grantRelic(relic);
  sfx("choose");announce("已购入 · "+relicTitle(relic),"收钟人已完成本层交易",1.65);
  leaveMerchant();
}

function chooseMerchantWeapon(shop){
  if(!activeMerchant(shop)||player.ash<MERCHANT_PRICE||player.weapons.includes(shop.weapon))return;
  if(player.weapons.length===2){
    chooseWeaponSlot(shop.weapon,`支付 ${MERCHANT_PRICE} 余烬，换下的武器留在原地。`,slot=>buyMerchantWeapon(shop,slot),showMerchant);

function encodeExpedition(snapshot){
  // Enemies, rooms and casts are shared by several systems. Keep their identity through a reload.
  const records=[], seen=new Map(), relicIds=new Map(relics.map(relic=>[relic,relic.id]));
  const encode=value=>{
    if(typeof value==="number"&&!Number.isFinite(value))return [String(value)];
    if(value==null||typeof value!=="object")return value;
    if(seen.has(value))return [seen.get(value)];
    const id=records.length;
    seen.set(value,id);records.push(null);
    if(relicIds.has(value))records[id]=["relic",relicIds.get(value)];
    else if(Array.isArray(value))records[id]=["array",value.map(encode)];
    else if(value instanceof Set)records[id]=["set",[...value].map(encode)];
    else if(value instanceof Map)records[id]=["map",[...value].map(([key,item])=>[encode(key),encode(item)])];
    else if(value instanceof Uint8Array||value instanceof Int8Array)records[id]=[value instanceof Uint8Array?"uint8":"int8",Array.from(value)];
    else records[id]=["object",Object.entries(value).filter(([,item])=>item!==undefined).map(([key,item])=>[key,encode(item)])];
    return [id];
  };

}
function decodeExpedition(raw){
  const {version,root,records}=JSON.parse(raw);
  if(version!==1||!Array.isArray(records))throw Error("Unsupported expedition save");
  const relicById=new Map(relics.map(relic=>[relic.id,relic]));
  const objects=records.map(([kind,data])=>{
    switch(kind){
      case "relic":if(relicById.has(data))return relicById.get(data);break;
      case "array":return [];
      case "set":return new Set();
      case "map":return new Map();
      case "uint8":return Uint8Array.from(data);
      case "int8":return Int8Array.from(data);
      case "object":return {};
    }
    throw Error("Invalid expedition save entry");
  });
  const decode=value=>{
    if(!Array.isArray(value))return value;
    const [ref]=value;
    if(typeof ref==="string")return Number(ref);
    if(!Object.hasOwn(objects,ref))throw Error("Missing expedition reference");
    return objects[ref];
  };
  records.forEach(([kind,data],id)=>{
    const target=objects[id];
    if(kind==="array")for(const value of data)target.push(decode(value));
    if(kind==="set")for(const value of data)target.add(decode(value));
    if(kind==="map")for(const [key,value] of data)target.set(decode(key),decode(value));
    if(kind==="object")for(const [key,value] of data){

    }
  });

}

function nearInteraction(){

function offerRelics(count){
  const pool=relics.filter(canTakeRelic);
  const pick=items=>items.splice(Math.floor(Math.random()*items.length),1)[0];
  const bySchool=[];
  for(const school of Object.keys(schools)){
    const options=pool.filter(r=>r.school===school);
    const fresh=options.filter(r=>!previousRelicOffer.includes(r));
    if(options.length)bySchool.push(pick(fresh.length?fresh:options));
  }
  if(count<bySchool.length){
    const distinct=[];
    while(distinct.length<count)distinct.push(pick(bySchool));
    return distinct;
  }
  const spare=pool.filter(r=>!bySchool.includes(r));
  while(bySchool.length<count&&spare.length)bySchool.push(pick(spare));
  return bySchool;
}

  wakeAudio();showModal(heading("守钟人的武技","沿走廊探索、肃清整层，再走到出口烛台与下行阶梯。")+
    grid([["移动","WASD / 方向键，触屏使用左侧摇杆"],["武器普攻","J 自动瞄准，鼠标左键朝光标出招。长按连击，光环亮起时点按可强化下一招。"],["武器与专属技","小怪有 5% 几率掉落武器，按 F 拾取。最多携带两把，按 T 切换，按 R 释放专属技。两把武器共用专属技冷却。"],["铸钟武库","第四层首领掉三把不同的武器，可在下行前三选一，也可跳过。触屏可直接点击武技、切换和拾取。"],["闪步","空格无敌闪避，可取消剑招。完美闪步额外积攒余烬。"],["焚印","按 E 或点一下技能按钮，朝移动方向扇形发射焚球，基础三颗，可通过遗物增加。站定时沿当前朝向发射。"],["丧钟",`Q 消耗 100 余烬，对视线内的敌人造成伤害，并清除附近弹幕。基础伤害从首层的 ${FLOOR_BELL_DAMAGE[0]} 点开始，随层数提高。`],["探索","M 查看已走过的区域。靠近烛台、补给箱或阶梯，按 F 或点交互按钮。"]])+row(btn("dismiss","返回",true)));
  $("dismiss").onclick=closeModal;
}
function records(){
  const lore={hound:"锁定前方后会直线扑袭。看到地面红线时向侧面闪避。",archer:"喜欢保持距离。青色虚线标示它的射击方向。",brute:"沉重的双拳会震击周围，攻击前有明显蓄力。",eye:"把爆裂刻印放在你刚才的位置。走出圆环即可躲开。",warden:"拉开距离时会预判你的跑位，亮起冲撞线后迅速突进，半血后更快。可急停、掉头或横闪，再趁收招反击。半血召唤裂骨猎犬和两只拦路钟影。",bell:"远处的符印会预判你的跑位，看到圆环就变向。突进时向红线侧面闪避。半血后符印扩散，弹幕加速，并召出蚀日之眼和两只拦路钟影。",sentinel:"两只钟影分守首领房外圈，轮流预警并快速扫击扇形区域。绕到侧面或用远程武器先击破它。"};
  const known=Object.entries(beasts).map(([id,b])=>[save.unlocked[id]?b.name:"未遭遇",save.unlocked[id]?lore[id]:"在远征中首次遭遇后解锁"]);
  showModal(heading("远征档案",`远征 ${save.runs} 次 · 通关 ${save.wins} 次 · 最深 ${save.best} / 7 层 · 累计击败 ${save.kills}`)+grid(known)+row(btn("dismiss","返回",true)));
  $("dismiss").onclick=closeModal;
}
function toggleSound(){save.muted=!save.muted;if(!save.muted)wakeAudio();if(audioOut)audioOut.gain.value=save.muted?0:.38;syncSound();storeSave()}

function syncTouchLayout(){
  const app=$("app");
  app.classList.toggle("touch-ui",touchUI);
  app.classList.toggle("touch-left",save.touchLeft);
  app.classList.toggle("touch-large",save.touchLarge);
}
function resetInput(){
  keys.clear();actions.clear();touchCasts.clear();touchAim=null;weaponAim=null;
  if(player){player.buffer=null;player.weaponInput=0}
  resetCanvasPointer();resetStick();
  for(const [button,id] of controlPointers){
    controlPointers.delete(button);button.classList.remove("is-pressed");releasePointer(button,id);
  }
}
function releasePointer(element,id){if(id!==null&&element.hasPointerCapture?.(id))element.releasePointerCapture(id)}
function resetCanvasPointer(){
  const id=pointer.id;pointer.id=null;pointer.down=false;releasePointer(canvas,id);
}
function controlDelta(event,x,y){
  const dx=event.clientX-x, dy=event.clientY-y;
  return touchRotated?{x:dy,y:-dx}:{x:dx,y:dy};
}
function controlPoint(event,box){
  return controlDelta(event,box.left+(touchRotated?box.width:0),box.top);
}
function point(event){
  const local=controlPoint(event,canvas.getBoundingClientRect());
  pointer.x=(local.x-ox)/scale;pointer.y=(local.y-oy)/scale;
}
canvas.addEventListener("pointermove",e=>{if(e.pointerType!=="touch"&&state==="fight")point(e)});
canvas.addEventListener("pointerdown",e=>{
  if(state!=="fight"||e.pointerType==="touch"||e.button!==0||pointer.id!==null)return;
  wakeAudio();lastAction="mouse";point(e);pointer.id=e.pointerId;pointer.down=true;
  queueBasicAttack(true);canvas.setPointerCapture(e.pointerId);e.preventDefault();
});
for(const type of ["pointerup","pointercancel","lostpointercapture"])canvas.addEventListener(type,e=>{if(e.pointerId===pointer.id)resetCanvasPointer()});
canvas.addEventListener("contextmenu",e=>e.preventDefault());

const movementZone=$("touchMove"), pad=$("stick"), stickKnob=pad.firstElementChild;
function resetStick(){
  const id=stick.id;
  stick.id=null;stick.x=0;stick.y=0;stickKnob.style.transform="";
  pad.style.removeProperty("--stick-x");pad.style.removeProperty("--stick-y");pad.classList.remove("is-pressed");
  releasePointer(movementZone,id);
}
function moveStick(e){
  if(stick.id!==e.pointerId)return;
  const {x:dx,y:dy}=controlDelta(e,stick.startX,stick.startY), distance=Math.hypot(dx,dy);
  const power=clamp((distance-6)/34,0,1), factor=distance?power/distance:0;
  stick.x=dx*factor;stick.y=dy*factor;
  stickKnob.style.transform=`translate(${stick.x*stick.knobTravel}px,${stick.y*stick.knobTravel}px)`;
}
movementZone.onpointerdown=e=>{
  if(state!=="fight"||stick.id!==null||e.button>0)return;
  e.preventDefault();wakeAudio();lastAction="touch";
  const area=movementZone.getBoundingClientRect(), radius=pad.getBoundingClientRect().width/2;
  const origin=controlPoint(e,area), width=touchRotated?area.height:area.width, height=touchRotated?area.width:area.height;
  Object.assign(stick,{id:e.pointerId,startX:e.clientX,startY:e.clientY,knobTravel:radius*.54});
  pad.style.setProperty("--stick-x",`${clamp(origin.x,radius,width-radius)}px`);
  pad.style.setProperty("--stick-y",`${clamp(origin.y,radius,height-radius)}px`);
  pad.classList.add("is-pressed");movementZone.setPointerCapture(e.pointerId);
};
movementZone.onpointermove=moveStick;
for(const type of ["pointerup","pointercancel","lostpointercapture"])movementZone.addEventListener(type,e=>{if(e.pointerId===stick.id)resetStick()});

function updateTouchAim(e){
  if(!touchAim||touchAim.id!==e.pointerId)return;
  const {x:dx,y:dy}=controlDelta(e,touchAim.x,touchAim.y), distance=Math.hypot(dx,dy);
  touchAim.angle=distance>=11?Math.atan2(dy,dx):null;
  touchAim.dragged||=touchAim.angle!==null;
  touchAim.strength=clamp((distance-11)/56,0,1);
}
for(const b of skillButtons){
  b.onpointerdown=e=>{
    if(state!=="fight"||b.disabled||e.button>0||controlPointers.has(b))return;
    const act=b.dataset.act, canAim=e.pointerType==="touch"&&(act==="skill"||act==="weapon");
    if(canAim&&touchAim)return;
    e.preventDefault();b.setPointerCapture(e.pointerId);wakeAudio();lastAction="touch";
    controlPointers.set(b,e.pointerId);b.classList.add("is-pressed");
    if(canAim)touchAim={id:e.pointerId,act,x:e.clientX,y:e.clientY,angle:null,dragged:false,strength:0};
    else if(act==="attack")queueBasicAttack(false);
    else actions.add(act);
  };
  b.onpointermove=updateTouchAim;
  const endPress=(e,cast)=>{
    if(controlPointers.get(b)!==e.pointerId)return;
    controlPointers.delete(b);b.classList.remove("is-pressed");
    if(touchAim?.id===e.pointerId){
      if(cast&&state==="fight"){
        updateTouchAim(e);
        const {act,angle,strength,dragged}=touchAim;
        if(!dragged||angle!==null){lastAction="touch";actions.add(act);touchCasts.set(act,{angle,strength})}
      }
      touchAim=null;
    }
    releasePointer(b,e.pointerId);
  };
  b.onpointerup=e=>endPress(e,true);
  b.onpointercancel=b.onlostpointercapture=e=>endPress(e,false);
  b.onclick=e=>{
    if(e.detail!==0||state!=="fight")return;
    lastAction="keyboard";
    if(b.dataset.act==="attack")queueBasicAttack(false);
    else actions.add(b.dataset.act);
  };
}
document.addEventListener("pointerdown",e=>{
  if(e.pointerType==="touch"&&!touchUI){touchUI=true;syncTouchLayout();resize();if(player&&state!=="home")drawHud()}
},true);
const modalPanel=$("panel");
let panelSwipe=null, draggedPanelArea=null;
modalPanel.addEventListener("pointerdown",e=>{
  if(e.isPrimary===false&&panelSwipe?.items.isConnected)return;
  panelSwipe=null;draggedPanelArea=null;
  if(e.pointerType!=="touch"||!touchRotated)return;
  const scrollAreas=".panel, .modal-content, .pause-body, .merchant-panel > .choices, .relic-choice-panel > .choices, .inventory-list";
  for(let items=e.target.closest(scrollAreas);items;items=items.parentElement?.closest(scrollAreas)){
    if(items.scrollHeight<=items.clientHeight||getComputedStyle(items).overflowY==="hidden")continue;
    panelSwipe={id:e.pointerId,items,x:e.clientX,y:e.clientY,top:items.scrollTop};break;
  }
});
modalPanel.addEventListener("pointermove",e=>{
  if(panelSwipe?.id!==e.pointerId||!panelSwipe.items.isConnected)return;
  const {x,y}=controlDelta(e,panelSwipe.x,panelSwipe.y);
  if(!draggedPanelArea){
    if(Math.abs(y)<9||Math.abs(y)<Math.abs(x))return;
    draggedPanelArea=panelSwipe.items;
    draggedPanelArea.setPointerCapture(e.pointerId);
  }
  panelSwipe.items.scrollTop=panelSwipe.top-y;
});
for(const type of ["pointerup","pointercancel"]){
  modalPanel.addEventListener(type,e=>{if(panelSwipe?.id===e.pointerId)panelSwipe=null});
}
modalPanel.addEventListener("lostpointercapture",e=>{
  if(panelSwipe?.id===e.pointerId&&panelSwipe.items===e.target)panelSwipe=null;
});
modalPanel.addEventListener("click",e=>{
  if(e.detail===0||!draggedPanelArea?.contains(e.target))return;
  draggedPanelArea=null;e.preventDefault();e.stopImmediatePropagation();
},true);
modalPanel.addEventListener("click",e=>{
  const button=e.target.closest("[data-pick]");if(button)modalChoices[Number(button.dataset.pick)]?.();
});
window.addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(!$("curtain").hidden&&e.code==="Tab"){
    const all=[...$("panel").querySelectorAll('button:not(:disabled), [tabindex="0"]')], first=all[0], last=all.at(-1);
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}
  }
  if(e.code==="Escape"&&!e.repeat){
    if(state==="relic-inventory"){closeRelicInventory();return}
    if(state==="fight")pause();else if(state==="pause")resume();else if(state==="map-preview")closeFloorMap();else if(state==="cache")closeCache();else if(state==="weapon")closeWeaponLoot();else if(state==="merchant")leaveMerchant();else if(state==="routes"||state==="tribute")closeOptionalChoice();else if(state==="home")closeModal();return;
  }
  if(e.code==="KeyI"&&!e.repeat){
    if(state==="relic-inventory")closeRelicInventory();else showRelicInventory();
    return;
  }
  if(e.code==="KeyM"&&!e.repeat){
    if(state==="fight")showFloorMap();else if(state==="map-preview")closeFloorMap();
    return;
  }
  if(!e.repeat&&/^Digit[0-9]$/.test(e.code)&&modalChoices.length){modalChoices[(Number(e.code.slice(-1))||10)-1]?.();return}
  if(state!=="fight")return;
  if(scrollLockKeys.includes(e.code))e.preventDefault();
  keys.add(e.code);
  if(e.code==="KeyJ"&&!e.repeat){lastAction="keyboard";queueBasicAttack(false)}
  if(!e.repeat){
    if(e.code==="Space")actions.add("dash");
    if(e.code==="KeyE")actions.add("skill");
    if(e.code==="KeyQ")actions.add("ult");
    if(e.code==="KeyR")actions.add("weapon");
    if(e.code==="KeyT")actions.add("switch");
    if(e.code==="KeyF")interact();
  }
});
window.addEventListener("keyup",e=>keys.delete(e.code));
function parkExpedition(){
  resetInput();
  if(state==="fight"||state==="descend"){state="pause";showPauseMenu()}
  saveExpedition();
}
window.addEventListener("blur",parkExpedition);
window.addEventListener("pagehide",parkExpedition);
function redrawSurfaces(){
  invalidateScenery();last=nextMobileDraw=mobileTime=0;
  if(player&&state!=="home"&&!document.hidden)resize();
}
canvas.addEventListener("contextlost",()=>{
  fieldLost=true;
  if(state==="fight")pause();
});
canvas.addEventListener("contextrestored",()=>{fieldLost=false;redrawSurfaces()});
scenery.addEventListener("contextlost",()=>{sceneryLost=true;invalidateScenery()});
scenery.addEventListener("contextrestored",()=>{sceneryLost=false;redrawSurfaces()});
glowSheet.addEventListener("contextrestored",()=>glowStamps.clear());
document.addEventListener("visibilitychange",()=>{
  if(document.hidden)parkExpedition();
  else if(touchUI)requestAnimationFrame(redrawSurfaces);
});
window.addEventListener("pageshow",e=>{if(e.persisted&&touchUI)requestAnimationFrame(redrawSurfaces)});
window.addEventListener("resize",resize);
window.visualViewport?.addEventListener("resize",()=>{if(touchUI)resize()});
window.visualViewport?.addEventListener("scroll",()=>{if(touchUI)syncTouchViewport()});
window.addEventListener("orientationchange",resetInput);
$("guide").onclick=showGuide;$("records").onclick=records;$("sound").onclick=toggleSound;$("pause").onclick=pause;
$("mapButton").onclick=()=>{if(state==="fight")showFloorMap()};
$("relicButton").onclick=showRelicInventory;
$("interact").onclick=interact;
for(let i=0;i<(touchUI?12:30);i++){
  const m=document.createElement("i");m.className="ember";m.style.cssText=`--x:${between(0,100)}%;--r:${between(1,3)}px;--dx:${between(-70,55)}px;--time:${between(5,12)}s;--delay:${between(-12,0)}s`;$("embers").append(m);
}

function advanceFight(dt){
  visualTime=(visualTime+dt)%86400;stepEffects(dt);
  if(hitStop>0)hitStop-=dt;else tick(dt);
}
function trackMobileCadence(dt){
  if(slowMobile||dt<=0)return;
  cadenceFrames++;
  if(dt>.023)lateFrames++;
  if(cadenceFrames<36)return;
  slowMobile=lateFrames>=12;
  cadenceFrames=lateFrames=0;
  if(slowMobile){resize(false);nextMobileDraw=0}
}
function loop(ms){
  requestAnimationFrame(loop);
  if(document.hidden||fieldLost||!ctx||(state!=="fight"&&state!=="descend")){last=mobileTime=0;return}
  const dt=last?clamp((ms-last)/1000,0,touchUI?MOBILE_STEP*4:.033):0;last=ms;
  if(touchUI)trackMobileCadence(dt);
  if(state==="fight"){
    if(touchUI){
      mobileTime=Math.min(mobileTime+dt,MOBILE_STEP*4);
      while(mobileTime+1e-6>=MOBILE_STEP&&state==="fight"){
        mobileTime=Math.max(0,mobileTime-MOBILE_STEP);
        advanceFight(MOBILE_STEP);
      }
    }else advanceFight(dt);
    hudTime-=dt;if(hudTime<=0){hudTime=touchUI?.1:.078;drawHud()}
    if(elapsed-lastRunSave>=RUN_SAVE_INTERVAL)saveExpedition();
  }else{
    descent.time-=dt;
    if(descent.time<=0){const {path}=descent;descent=null;stage++;enter(path);saveExpedition()}
  }
  if(!touchUI||ms>=nextMobileDraw-.5){
    nextMobileDraw=Math.max(nextMobileDraw+MOBILE_DRAW_INTERVAL,ms+MOBILE_DRAW_INTERVAL/2);
    draw();
  }
}
function enableStart(){
  if($("start").dataset.ready==="true")return;
  $("start").onclick=startExpedition;$("start").disabled=false;$("start").setAttribute("aria-busy","false");
  $("startLabel").textContent=hasStoredRun?"继续远征":"开始远征";$("startStatus").hidden=true;
  $("start").dataset.ready="true";
}
if(ctx){
  syncTouchLayout();resize();syncSound();updateBest();
  const preview=requestArt("openingSprites","high");
  if(preview.complete)enableStart();
  else{
    const timeout=setTimeout(enableStart,400);
    const ready=()=>{clearTimeout(timeout);enableStart()};
    preview.addEventListener("load",ready,{once:true});
    preview.addEventListener("error",ready,{once:true});
  }
  $("app").classList.add("boot-ready");
  requestAnimationFrame(loop);
}else window.ashwakeStartError?.("游戏画面初始化失败。点击重新加载再试一次。");

</script>
